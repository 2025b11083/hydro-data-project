server {
    listen 80;
    server_name localhost;
    # 网站根目录，data_collector.sh日志存放路径
    root /data/hydro;

    # 开启目录浏览、文件下载
    autoindex on;
    autoindex_exact_size off;
    autoindex_localtime on;

    # 开启gzip压缩
    gzip on;
    gzip_types text/plain text/csv application/json text/javascript;
    gzip_min_length 1024;

    # 定义日志文件MIME类型，浏览器直接打开文本日志
    types {
        text/plain .log .txt .csv;
    }
}
